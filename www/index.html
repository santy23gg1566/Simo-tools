const b64=u=>btoa(String.fromCharCode(...u));const ub64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const derive=async(password,salt)=>{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);};

async function openAccount(p,k,remember=true){active=p;key=k;let raw=storageGet(ID+'data_'+p.id);db=raw?await decrypt(JSON.parse(raw),k):blank();patchDB();db.settings.remember=remember;const token=JSON.stringify({id:p.id,key:b64(new Uint8Array(await crypto.subtle.exportKey('raw',k)))});storageSet(ID+'session',token,remember?localStorage:sessionStorage);try{(remember?sessionStorage:localStorage).removeItem(ID+'session')}catch{}page='home';applySettings();save();render();}

function openForm(kind,id){const type=kind==='exam'?'task':kind;const item=id?db[type==='task'?'tasks':type==='schedule'?'schedule':type==='grade'?'grades':type==='note'?'notes':type==='card'?'cards':'goals'].find(x=>x.id===id):null;const x=item||{};let body='';if(type==='task')body=`<div class="field"><label>Título</label><input name="title" maxlength="130" required value="${h(x.title||'')}" placeholder="¿Qué tienes que hacer?"></div><div class="fields"><div class="field"><label>Materia</label><input name="subject" maxlength="65" value="${h(x.subject||'')}" placeholder="Ej. Matemáticas"></div><div class="field"><label>Fecha</label><input type="date" name="due" value="${h(x.due||today())}"></div><div class="field"><label>Prioridad</label><select name="priority">${['Baja','Media','Alta'].map(p=>`<option ${x.priority===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select name="kind"><option value="task" ${x.kind!=='exam'&&kind!=='exam'?'selected':''}>Tarea</option><option value="exam" ${x.kind==='exam'||kind==='exam'?'selected':''}>Examen</option></select></div></div>`;

if(type==='grade')body=`<div class="field"><label>Materia</label><input name="subject" required maxlength="70" value="${h(x.subject||'')}" placeholder="Ej. Ciencias Naturales"></div><div class="field"><label>Evaluación</label><input name="label" maxlength="70" value="${h(x.label||'')}" placeholder="Ej. Examen parcial"></div><div class="fields"><div class="field"><label>Calificación (0 a 100)</label><input name="score" type="number" min="0" max="100" step=".1" required value="${x.score??''}"></div><div class="field"><label>Peso (ej. 1, 2, 3...)</label><input name="weight" type="number" min=".1" max="1000" step=".1" required value="${x.weight??1}"></div></div>`;

modal(id?'Editar '+({task:'tarea',schedule:'clase',grade:'calificación',note:'apunte',card:'tarjeta',goal:'meta'}[type]||'elemento'):'Nuevo '+({task:'elemento',schedule:'horario',grade:'nota',note:'apunte',card:'flashcard',goal:'meta'}[type]||'elemento'),`<form id="record-form" data-kind="${type}" data-id="${h(id||'')}" class="stack" style="margin-top:15px">${body}${formButtons(!!id)}</form>`);}
function closeModal(){document.getElementById('modal-root').innerHTML='';modalConfirm=null;}

function logout(){try{localStorage.removeItem(ID+'session');sessionStorage.removeItem(ID+'session')}catch{}active=null;key=null;db=null;page='home';render();}
async function handleAuth(form){const f=new FormData(form),signup=f.get('mode')==='signup',user=String(f.get('user')||'').trim().toLowerCase(),password=String(f.get('password')||''),remember=!!f.get('remember');try{if(!crypto?.subtle)throw Error('Abre la app con Chrome en un entorno seguro (HTTPS) o en el APK.');if(!user||password.length<8)throw Error('Escribe un usuario y contraseña de al menos 8 caracteres.');if(signup){const name=String(f.get('name')||'').trim();if(name.length<2)throw Error('Escribe un nombre válido.');if(password!==f.get('confirm'))throw Error('Las contraseñas no coinciden.');if(profiles.some(p=>p.user===user))throw Error('Ese usuario ya existe en este dispositivo.');const salt=b64(crypto.getRandomValues(new Uint8Array(16))),k=await derive(password,salt),p={id:uid(),user,name,salt,proof:await encrypt({ok:true},k)};profiles.push(p);persistProfiles();await openAccount(p,k,remember);toast('¡Tu espacio está listo!');}else{const p=profiles.find(p=>p.user===user);if(!p)throw Error('Usuario o contraseña incorrectos.');const k=await derive(password,p.salt);try{if(!(await decrypt(p.proof,k)).ok)throw Error()}catch{throw Error('Usuario o contraseña incorrectos.')}await openAccount(p,k,remember);toast('¡Bienvenido otra vez!');}}catch(e){toast(e.message||'No fue posible entrar.','warn')}}
async function handleRecord(form){const f=new FormData(form),kind=form.dataset.kind,recordId=form.dataset.id;const s=n=>String(f.get(n)||'').trim();let next={};if(kind==='task'){if(!s('title'))return toast('Escribe un título.','warn');next={title:s('title'),subject:s('subject'),due:s('due'),priority:s('priority')||'Media',kind:s('kind')||'task',done:false}}else if(kind==='schedule'){next={subject:s('subject'),day:Number(s('day')),time:s('time'),room:s('room')};if(!next.subject||!next.time)return toast('Completa la materia y la hora.','warn')}else if(kind==='grade'){next={subject:s('subject'),label:s('label'),score:Number(s('score')),weight:Number(s('weight'))};if(!next.subject||!Number.isFinite(next.score)||next.score<0||next.score>100||!next.weight||next.weight<=0)return toast('Comprueba las calificaciones.','warn')}else if(kind==='note'){next={title:s('title'),body:s('body'),updated:new Date().toISOString()};if(!next.title)return toast('Pon un título a tu apunte.','warn')}else if(kind==='card'){next={topic:s('topic'),front:s('front'),back:s('back')};if(!next.front||!next.back)return toast('Completa pregunta y respuesta.','warn')}else if(kind==='goal'){next={text:s('text'),week:weekStart(),done:false};if(!next.text)return toast('Escribe tu meta.','warn')};const array=({task:'tasks',grade:'grades',schedule:'schedule',note:'notes',card:'cards',goal:'goals'})[kind],items=db[array];if(recordId){let idx=items.findIndex(x=>x.id===recordId);if(idx<0)return;items[idx]={...items[idx],...next};}else items.unshift({id:uid(),...next});closeModal();save();renderContent();toast('Guardado correctamente');}
function calcEval(expr){const str=expr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[\d.()+\-*/%\s]+$/.test(str))throw Error('Expresión inválida');const toks=str.match(/\d*\.\d+|\d+(?:\.\d+)?|[()+\-*/%]/g)||[],nums=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2};function apply(){const o=ops.pop(),b=nums.pop(),a=nums.pop();if(a===undefined||b===undefined)throw Error('Expresión incompleta');let v=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b;if(!Number.isFinite(v))throw Error('Operación no válida');nums.push(v)}let last='start';for(let i=0;i<toks.length;i++){let t=toks[i];if(/^\d/.test(t)||t[0]==='.'){let n=Number(t);if(!Number.isFinite(n))throw Error('Número inválido');nums.push(n);last='number'}else if(t==='('){ops.push(t);last='open'}else if(t===')'){while(ops.length&&ops.at(-1)!=='(')apply();if(ops.pop()!=='(')throw Error('Paréntesis incorrectos');last='number'}else if(t==='%'){if(!nums.length)throw Error('No hay número para porcentaje');nums[nums.length-1]/=100;last='number'}else{if((t==='-'||t==='+')&&(last==='start'||last==='open'||last==='operator'))nums.push(0);while(ops.length&&prec[ops.at(-1)]>=prec[t])apply();ops.push(t);last='operator'}}while(ops.length){if(ops.at(-1)==='(')throw Error('Paréntesis sin cerrar');apply()}if(nums.length!==1)throw Error('Expresión incompleta');return Math.round(nums[0]*1e9)/1e9;}
function notifySound(){if(!db.settings.sounds)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=660;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.1);osc.onended=()=>ctx.close();}catch{}}
function focusTick(){if(!focusRunning)return;const newRemain=Math.max(0,Math.ceil((focusEnd-Date.now())/1000));if(newRemain!==focusRemaining){focusRemaining=newRemain;if(page==='focus'){const el=document.querySelector('.focus-clock');if(el)el.textContent=`${pad(Math.floor(newRemain/60))}:${pad(newRemain%60)}`;let ring=document.querySelector('.focus-ring');if(ring)ring.style.setProperty('--p',`${Math.min(100,100*(1-newRemain/(studyMinutes*60)))}%`);}}if(newRemain===0){focusRunning=false;db.stats.focusMinutes=(db.stats.focusMinutes||0)+studyMinutes;save();if(page==='focus')renderContent();toast('¡Sesión de estudio completada!');notifySound();}}
function move2048(dir){if(!g2048||g2048.over)return;const prev=[...g2048.board],board=[...g2048.board];for(let i=0;i<4;i++){let indexes=dir==='left'?[0,1,2,3].map(j=>i*4+j):dir==='right'?[3,2,1,0].map(j=>i*4+j):dir==='up'?[0,1,2,3].map(j=>j*4+i):[3,2,1,0].map(j=>j*4+i);let row=indexes.map(j=>board[j]).filter(Boolean),result=[];for(let j=0;j<row.length;j++){if(row[j]===row[j+1]){let n=row[j]*2;result.push(n);g2048.score+=n;j++}else result.push(row[j]);}while(result.length<4)result.push(0);indexes.forEach((j,k)=>g2048.board[j]=result[k]);}if(g2048.board.some((v,i)=>v!==prev[i]))spawn2048();db.stats.game2048Best=Math.max(db.stats.game2048Best||0,g2048.score);let possible=g2048.board.some(v=>!v);if(!possible)for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c;if(c<3&&g2048.board[i]===g2048.board[i+1]||r<3&&g2048.board[i]===g2048.board[i+4])possible=true;}g2048.over=!possible;save();renderContent();}
async function exportData(){let payload={format:'simo-hub-tools-backup',version:1,exported:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`simo-hub-respaldo-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia de seguridad descargada.');}
async function importData(file){try{if(!file)return;if(file.size>5e6)throw Error('El archivo supera 5 MB.');const obj=JSON.parse(await file.text());if(obj.format!=='simo-hub-tools-backup'||!obj.data||!Array.isArray(obj.data.tasks))throw Error('Este archivo no es una copia válida de Simo Hub Tools.');confirmAction('Importar copia','Esto reemplazará las herramientas guardadas de tu cuenta actual. ¿Continuar?',()=>{db=obj.data;patchDB();applySettings();save();render();toast('Datos restaurados correctamente.')},'Restaurar datos');}catch(e){toast(e.message||'No se pudo importar.','warn')}finally{document.getElementById('import-file').value=''}}
async function doAction(el){const act=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;try{switch(act){case 'auth-tab':authMode=el.dataset.mode;render();break;case 'close-modal':closeModal();break;case 'confirm-modal':{let cb=modalConfirm;closeModal();if(cb)await cb();break;}case 'new':openForm(kind);break;case 'edit':openForm(kind,id);break;case 'delete-record':{let form=document.getElementById('record-form'),type=form.dataset.kind,id=form.dataset.id;let arr=({task:'tasks',schedule:'schedule',grade:'grades',note:'notes',card:'cards',goal:'goals'})[type];confirmAction('Eliminar elemento','Esta acción no se puede deshacer.',()=>{db[arr]=db[arr].filter(x=>x.id!==id);save();renderContent();toast('Elemento eliminado.')});break;}case 'toggle-goal':{let g=db.goals.find(x=>x.id===id);if(g)g.done=!g.done;save();renderContent();break;}case 'toggle-task':{let t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();renderContent();break;}case 'day':scheduleDay=Number(el.dataset.day);renderContent();break;case 'filter':filter=el.dataset.filter;renderContent();break;case 'flip-card':cardBack=!cardBack;renderContent();break;case 'next-card':cardIndex=Math.min(db.cards.length-1,cardIndex+1);cardBack=false;renderContent();break;case 'prev-card':cardIndex=Math.max(0,cardIndex-1);cardBack=false;renderContent();break;case 'pick-card':cardIndex=Number(el.dataset.index);cardBack=false;renderContent();break;case 'focus-toggle':focusRunning=!focusRunning;if(focusRunning)focusEnd=Date.now()+focusRemaining*1000;renderContent();break;case 'focus-reset':focusRunning=false;focusRemaining=studyMinutes*60;renderContent();break;case 'focus-length':studyMinutes=Number(el.dataset.minutes);focusRunning=false;focusRemaining=studyMinutes*60;renderContent();break;case 'calc':{let c=el.dataset.value;if(c==='C'){calcExpr='';calcResult='0'}else if(c==='='){try{calcResult=String(calcEval(calcExpr));calcExpr=calcResult}catch(e){toast(e.message,'warn')}}else if(calcExpr.length<90)calcExpr+=c;renderContent();break;}case 'rule':{let a=Number(document.getElementById('rule-a').value),b=Number(document.getElementById('rule-b').value),c=Number(document.getElementById('rule-c').value);if(!a||!Number.isFinite(b*c/a))return toast('Comprueba los números; A no puede ser cero.','warn');document.getElementById('rule-result').value=String(Math.round(b*c/a*1e8)/1e8);break;}case 'percent':{let a=Number(document.getElementById('pct-p').value),b=Number(document.getElementById('pct-n').value);document.getElementById('pct-result').textContent=`Resultado: ${Math.round(a*b/100*1e8)/1e8}`;break;}case 'game-open':game=el.dataset.game;if(game==='quiz')newQuiz();if(game==='memory')newMemory();if(game==='2048')new2048();renderContent();break;case 'game-back':game='menu';renderContent();break;case 'quiz-answer':{if(!quiz||quiz.answered!==null)return;quiz.answered=Number(el.dataset.option);if(quiz.answered===quiz.q[quiz.index][2])quiz.score++;notifySound();renderContent();break;}case 'quiz-next':{if(quiz.index===9){quiz.finished=true;db.stats.quizBest=Math.max(db.stats.quizBest||0,quiz.score);save();}else{quiz.index++;quiz.answered=null}renderContent();break;}case 'quiz-restart':newQuiz();renderContent();break;case 'memory-reset':newMemory();renderContent();break;case 'memory-flip':{if(!memory||memory.locked)return;let i=Number(el.dataset.index);if(memory.open.includes(i)||memory.matched.includes(i))return;memory.open.push(i);if(memory.open.length===2){memory.moves++;if(memory.items[memory.open[0]].v===memory.items[memory.open[1]].v){memory.matched.push(...memory.open);memory.open=[];notifySound();if(memory.matched.length===12){db.stats.memoryBest=!db.stats.memoryBest?memory.moves:Math.min(db.stats.memoryBest,memory.moves);save();}}else{memory.locked=true;setTimeout(()=>{if(memory){memory.open=[];memory.locked=false;if(page==='games'&&game==='memory')renderContent()}},650)}}renderContent();break;}case '2048-move':move2048(el.dataset.dir);break;case '2048-reset':new2048();renderContent();break;case 'setting':db.settings[el.dataset.key]=el.dataset.value;save();render();break;case 'profile':modal('Editar perfil',`<form id="profile-form" class="stack"><div class="field"><label>Tu nombre</label><input name="name" maxlength="45" value="${h(active.name)}" required></div>${formButtons()}</form>`);break;case 'password':modal('Cambiar contraseña',`<form id="password-form" class="stack"><div class="field"><label>Contraseña actual</label><input type="password" name="old" required></div><div class="field"><label>Nueva contraseña</label><input type="password" name="new" minlength="8" required></div><div class="field"><label>Confirmar contraseña</label><input type="password" name="confirm" minlength="8" required></div>${formButtons()}</form>`);break;case 'logout':logout();break;case 'export':await exportData();break;case 'import':document.getElementById('import-file').click();break;case 'reset-data':confirmAction('Vaciar herramientas','Se eliminarán tus tareas, notas, horario, calificaciones y récords, pero se conservará tu cuenta y tus preferencias.',()=>{let settings=db.settings;db=blank();db.settings=settings;save();render();toast('Datos de herramientas eliminados.')},'Vaciar todo');break;case 'install':await installPWA();break;}}catch(e){console.error(e);toast('No se pudo completar la acción.','warn');}}
async function installPWA(){if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){toast('Esta aplicación ya está instalada.');return}if(installEvent){let p=installEvent;installEvent=null;await p.prompt();await p.userChoice;return}const android=/Android/i.test(navigator.userAgent),ios=/iPhone|iPad/i.test(navigator.userAgent);modal('Instalar Simo Hub Tools',`<p class="subtle">${ios?'En iPhone o iPad: abre Compartir y elige “Añadir a pantalla de inicio”.':android?'En Chrome para Android: abre el menú ⋮ y toca “Instalar aplicación” o “Añadir a pantalla de inicio”.':'En Chrome o Edge: busca el icono de instalar en la barra de direcciones o elige “Instalar aplicación” en el menú.'}</p><div class="notice small">Debes abrir la página publicada con HTTPS (por ejemplo, en Netlify). Desde un archivo HTML local no aparece la instalación web. Android o el navegador siempre pueden pedir confirmación.</div><div class="modal-actions"><button class="btn" data-action="close-modal">Entendido</button></div>`);}
async function submitHandler(e){if(!e.target.matches('form'))return;e.preventDefault();const form=e.target;if(form.id==='auth-form'){await handleAuth(form);return}if(form.id==='record-form'){await handleRecord(form);return}if(form.id==='profile-form'){let name=String(new FormData(form).get('name')).trim();if(name.length<2)return toast('Escribe un nombre válido.','warn');active.name=name;persistProfiles();closeModal();render();toast('Perfil actualizado.');return}if(form.id==='password-form'){const f=new FormData(form),old=String(f.get('old')),next=String(f.get('new'));if(next.length<8||next!==f.get('confirm'))return toast('Revisa la nueva contraseña.','warn');try{const chk=await derive(old,active.salt);await decrypt(active.proof,chk);const salt=b64(crypto.getRandomValues(new Uint8Array(16))),newKey=await derive(next,salt);active.salt=salt;active.proof=await encrypt({ok:true},newKey);key=newKey;persistProfiles();save();const token=JSON.stringify({id:active.id,key:b64(new Uint8Array(await crypto.subtle.exportKey('raw',newKey)))});const remember=!!storageGet(ID+'session');storageSet(ID+'session',token,remember?localStorage:sessionStorage);closeModal();toast('Contraseña actualizada.');}catch{toast('Contraseña actual incorrecta.','warn')}return}}
let pointerStart=null;
document.addEventListener('submit',submitHandler);
document.addEventListener('click',async e=>{if(e.target.id==='modal-overlay'){closeModal();return}let goto=e.target.closest('[data-go]');if(goto){page=goto.dataset.go;filter='all';if(page==='games')game='menu';render();window.scrollTo({top:0,behavior:'instant'});return}const button=e.target.closest('[data-action]');if(button)await doAction(button)});
document.addEventListener('change',e=>{let inp=e.target;if(inp.id==='import-file'){importData(inp.files[0]);return}const k=inp.dataset.setting;if(!k||!db)return;db.settings[k]=inp.type==='checkbox'?inp.checked:inp.value;save();applySettings();renderContent();});
document.addEventListener('input',e=>{if(e.target.id==='search-notes'){noteSearch=e.target.value;const start=e.target.selectionStart;renderContent();let input=document.getElementById('search-notes');input?.focus();input?.setSelectionRange(start,start);}});
document.addEventListener('keydown',e=>{if(page==='games'&&game==='2048'&&!document.querySelector('.modal-overlay')){const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(map[e.key]){e.preventDefault();move2048(map[e.key])}}if(e.key==='Escape'&&document.querySelector('.modal-overlay'))closeModal();});
document.addEventListener('touchstart',e=>{let board=e.target.closest('#board2048');if(board)pointerStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{if(!pointerStart||page!=='games'||game!=='2048')return;const dx=e.changedTouches[0].clientX-pointerStart.x,dy=e.changedTouches[0].clientY-pointerStart.y;pointerStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move2048(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});
window.addEventListener('appinstalled',()=>{installEvent=null;toast('¡Simo Hub Tools instalada!')});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(db?.settings.mode==='system')applySettings()});
window.addEventListener('DOMContentLoaded',async()=>{if(!crypto?.subtle){document.getElementById('app').innerHTML='<div class="card" style="margin:30px auto;max-width:500px"><h2>Abre Simo Hub Tools en HTTPS o en el APK</h2><p>Tu navegador no tiene disponible el cifrado necesario para iniciar sesión. Usa Chrome o la aplicación Android.</p></div>';return}await restore();if(!active){loadProfiles();authMode=profiles.length?'login':'signup';render()}setInterval(focusTick,500);if('serviceWorker'in navigator&&location.protocol==='https:'&&location.hostname!=='localhost'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}});
</script>
