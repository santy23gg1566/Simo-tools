async function doAuth(form){const fd=new FormData(form),mode=fd.get('mode'),email=str(fd.get('email')).toLowerCase(),password=String(fd.get('password')),remember=fd.has('remember');errorText='';try{if(!crypto?.subtle)throw Error('Este navegador necesita Web Crypto. Abre el HTML en Chrome o el APK.');if(mode==='register'){const name=str(fd.get('name'));if(name.length<2)throw Error('Escribe un nombre de al menos 2 caracteres.');if(password.length<8)throw Error('La contraseña debe tener al menos 8 caracteres.');if(password!==String(fd.get('confirm')))throw Error('Las contraseñas no coinciden.');if(profiles.some(p=>p.email===email))throw Error('Ese usuario ya está registrado en este dispositivo.');const salt=b64(crypto.getRandomValues(new Uint8Array(16))),key=await derive(password,salt);const p={id:id(),name,email,salt,proof:await encrypt({ok:true},key),created:new Date().toISOString()};profiles.push(p);persistProfiles();await openAccount(p,key,remember);await save();toast('Espacio creado correctamente.');}else{const p=profiles.find(p=>p.email===email);if(!p)throw Error('Usuario o contraseña incorrectos.');const key=await derive(password,p.salt);try{await decrypt(p.proof,key)}catch{throw Error('Usuario o contraseña incorrectos.')}await openAccount(p,key,remember);toast('Bienvenido de nuevo.');}}catch(e){errorText=e.message||'No pudimos iniciar sesión.';authView()}}
function logout(){localStorage.removeItem(K+'session');sessionStorage.removeItem(K+'session');active=null;cryptKey=null;db=null;query='';page='home';render()}
const timeNow=()=>new Date().toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});
function navItem(target,text,ico){return `<button data-page="${target}" class="${tab===target?'active':''}">${icon(ico)}<span>${text}</span></button>`}
function layout(){const display=active?.name?.split(' ')[0]||'Usuario';const header=`<div class="topbar"><div class="logo-row desktopbrand">${logo(38)}<span>SIMÓ <small>EVERYDAY</small></span></div><div class="logo-row mobilebrand">${logo(34)}<span>SIMÓ <small>EVERYDAY</small></span></div><div class="topright"><div class="search">${icon('search','icon-sm')}<input id="globalSearch" autocomplete="off" placeholder="Buscar herramientas..." aria-label="Buscar" value="${safe(query)}"></div><button class="ghost-icon" data-page="settings" title="Ajustes" aria-label="Ajustes">${icon('settings')}</button></div></div>`;document.getElementById('root').innerHTML=`<div class="shell"><aside class="side"><div class="logo-row">${logo()}<span>SIMÓ <small>EVERYDAY</small></span></div><div class="side-nav">${navItem('home','Inicio','home')}${navItem('tools','Herramientas','grid')}${navItem('activity','Mi actividad','calendar')}${navItem('settings','Configuración','settings')}</div><div class="side-footer"><div class="avatar">${safe(display.slice(0,2).toUpperCase())}</div><div style="min-width:0"><b class="tiny text-cut" style="display:block">${safe(active.name)}</b><small class="muted micro">Cuenta local</small></div><button class="ghost-icon" style="margin-left:auto;width:32px;height:32px" data-action="logout" title="Cerrar sesión">${icon('logout','icon-sm')}</button></div></aside><main class="main"><div>${header}</div><div id="content" class="pagefade"></div></main></div><nav class="bottomnav" aria-label="Menú principal">${navItem('home','Inicio','home')}${navItem('tools','Explorar','grid')}${navItem('activity','Actividad','calendar')}${navItem('settings','Ajustes','settings')}</nav>`;renderContent();}
function render(){if(!active){authView();return;}useSettings();layout();window.scrollTo({top:0,behavior:'instant'});}
function route(newPage){page=newPage;tab=['home','tools','activity','settings'].includes(newPage)?newPage:'tools';query='';render();}
function renderContent(){let html='';if(page==='home')html=homePage();else if(page==='tools')html=toolsPage();else if(page==='settings')html=settingsPage();else if(page==='activity')html=activityPage();else html=toolPage(page);$('#content').innerHTML=html;}
const tObj=id=>TOOLS.find(t=>t[0]===id);
function toolCard(t){return `<button class="tool-card" data-page="${t[0]}"><span class="tool-icon">${icon(t[3])}</span><span><h3>${t[1]}</h3><p>${t[2]}</p></span></button>`;}
function allDue(){return [...db.subscriptions.map(s=>({name:s.name,date:s.next,icon:'repeat',tool:'subscriptions',type:'Suscripción'})),...db.deadlines.filter(s=>!s.done).map(s=>({name:s.title,date:s.date,icon:'calendar',tool:'deadlines',type:'Vencimiento'})),...db.warranties.map(s=>({name:s.name,date:s.expires,icon:'award',tool:'warranties',type:'Garantía'}))].filter(x=>x.date&&days(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));}
function section(text,action,target){return `<div class="section-title"><h2>${text}</h2>${action?`<button class="btn small ghost" data-page="${target}">${action} ${icon('chevron','icon-sm')}</button>`:''}</div>`}
function homePage(){const due=allDue(),counts=db.subscriptions.length+db.deadlines.length+db.warranties.length,first=active.name.split(' ')[0];return `<div class="eyebrow">${safe(timeNow())}</div><h1 style="margin-top:9px">Hola, ${safe(first)} <span style="font-size:26px">✦</span></h1><p class="muted sm">Todo lo importante, en un solo lugar.</p><div class="hero"><div class="feature"><div><div class="eyebrow">SIMÓ · TU DÍA A DÍA</div><h2>Más orden.<br>Menos pendientes.</h2><p>Herramientas prácticas, sin complicaciones.</p></div><button data-page="tools">Explorar herramientas ${icon('arrow','icon-sm')}</button></div><div class="asidehero"><div><div class="eyebrow">Próximos 30 días</div><div class="metric">${due.filter(x=>days(x.date)<=30).length} <span style="font-weight:500;font-size:14px;color:var(--muted)">avisos</span></div><p class="muted tiny" style="margin:0">${due.length?`Lo más próximo: ${safe(due[0].name)}`:'Tu agenda está despejada'}</p></div><div class="aside-dots" style="display:flex;gap:5px"><span class="pill">${icon('checkcircle','icon-sm')} Local y privado</span></div></div></div>${section('Tus herramientas','Ver todas','tools')}<div class="grid-tools">${TOOLS.slice(0,8).map(toolCard).join('')}</div>${section('Próximos vencimientos','Ver actividad','activity')}${due.length?`<div class="card flat">${due.slice(0,4).map(x=>rowItem(x.icon,x.name,x.type+' · '+localDate(x.date),`<span class="tag ${days(x.date)<=7?'warm':''}">${days(x.date)===0?'Hoy':`En ${days(x.date)} d`}</span>`,x.tool)).join('')}</div>`:empty('bell','Nada urgente por ahora','Los recordatorios que agregues aparecerán aquí.')}`;}
function toolsPage(){const q=query.toLowerCase(),list=TOOLS.filter(t=>t.slice(1,3).join(' ').toLowerCase().includes(q));return `<div class="eyebrow">CENTRO DE HERRAMIENTAS</div><h1 style="margin-top:8px">Todo lo que necesitas.</h1><p class="muted">12 herramientas útiles pensadas para tu rutina.</p><div class="grid-tools" style="margin-top:22px">${list.map(toolCard).join('')||'<div class="empty full">No hay herramientas con ese nombre.</div>'}</div>`;}
function empty(ico,title,description){return `<div class="empty">${icon(ico)}<b>${title}</b><p>${description}</p></div>`;}
function rowItem(ico,title,subtitle,buttons='',target=''){return `<div class="tool-row"><span class="row-icon">${icon(ico)}</span><div class="row-main"><b>${safe(title)}</b><small>${safe(subtitle)}</small></div><div class="row-actions">${buttons||((target)?`<button class="ghost-icon" data-page="${target}" style="height:34px;width:34px">${icon('chevron','icon-sm')}</button>`:'')}</div></div>`;}
const delBtn=(collection,itemid)=>`<button class="ghost-icon" style="width:33px;height:33px" data-action="delete" data-collection="${collection}" data-id="${safe(itemid)}" aria-label="Eliminar" title="Eliminar">${icon('trash','icon-sm')}</button>`;
const copyBtn=(value)=>`<button class="ghost-icon" style="width:33px;height:33px" data-action="copy" data-copy="${safe(value)}" aria-label="Copiar" title="Copiar">${icon('copy','icon-sm')}</button>`;
const toolHead=(t)=>`<div class="pagehead"><button class="back" data-page="tools" aria-label="Volver">${icon('back')}</button><div><h1>${t[1]}</h1><p>${t[2]}</p></div></div>`;
const field=(label,content,extra='')=>`<div class="field ${extra}"><label>${label}</label>${content}</div>`;
const input=(name,type,placeholder='',extra='')=>`<input type="${type}" name="${name}" placeholder="${safe(placeholder)}" ${extra}>`;
function toolPage(tool){const t=tObj(tool);if(!t)return toolsPage();let inner=({subscriptions:subscriptionsPage,deadlines:deadlinesPage,warranties:warrantiesPage,wallet:walletPage,qr:qrPage,split:splitPage,photos:photosPage,links:linksPage,trips:tripsPage,snippets:snippetsPage,emergency:emergencyPage,compare:comparePage})[tool]?.()||'';return toolHead(t)+inner;}
function formCard(formId,title,content,btn='Guardar'){return `<div class="card"><div class="card-title">${title}</div><form id="${formId}" class="formgrid">${content}<div class="full"><button class="btn" type="submit">${icon('plus','icon-sm')} ${btn}</button></div></form></div>`;}
function subscriptionsPage(){let monthly=db.subscriptions.reduce((a,s)=>a+Number(s.amount)/(s.period==='annual'?12:s.period==='weekly'? (12/52):1),0);const next=[...db.subscriptions].filter(s=>s.next&&days(s.next)>=0).sort((a,b)=>a.next.localeCompare(b.next));return `<div class="stat-grid"><div class="stat"><div class="label">Estimado mensual</div><div class="value">${masked(money(monthly))}</div></div><div class="stat"><div class="label">Suscripciones</div><div class="value">${db.subscriptions.length}</div></div><div class="stat"><div class="label">Estimado anual</div><div class="value">${masked(money(monthly*12))}</div></div></div><div style="height:16px"></div>${formCard('add-sub','Nueva suscripción',field('Servicio',input('name','text','Ej. Música, streaming','required maxlength="60"'))+field('Importe',input('amount','number','0.00','min="0.01" step="0.01" required'))+field('Frecuencia',`<select name="period"><option value="monthly">Mensual</option><option value="annual">Anual</option><option value="weekly">Semanal</option></select>`)+field('Próximo cobro',input('next','date','','required')),'Agregar servicio')}${section('Tus servicios')}<div class="card flat">${db.subscriptions.length?db.subscriptions.map(s=>rowItem('repeat',s.name,`${money(s.amount)} · ${s.period==='annual'?'anual':s.period==='weekly'?'semanal':'mensual'} · ${localDate(s.next)}`,delBtn('subscriptions',s.id))).join(''):empty('repeat','Sin suscripciones','Agrega tus pagos y tendrás claridad sobre tus gastos recurrentes.')}</div><p class="hint">Los importes son estimaciones, no se cobra ni se cancela ningún servicio desde esta aplicación.</p>`;}
function deadlinesPage(){let sorted=[...db.deadlines].sort((a,b)=>Number(a.done)-Number(b.done)||a.date.localeCompare(b.date));return `${formCard('add-deadline','Nuevo vencimiento',field('Qué vence',input('title','text','Ej. Seguro, documento, factura','required maxlength="75"'))+field('Fecha',input('date','date','','required'))+field('Categoría',`<select name="category"><option>Personal</option><option>Pagos</option><option>Trámites</option><option>Estudios</option><option>Otro</option></select>`),'Guardar fecha')}${section('Fechas guardadas')}<div class="card flat">${sorted.length?sorted.map(s=>rowItem('calendar',s.title,`${s.category} · ${localDate(s.date)}`,`<button class="btn small ${s.done?'ghost':'outline'}" data-action="deadlineToggle" data-id="${s.id}">${s.done?'Reabrir':'Hecho'}</button>${delBtn('deadlines',s.id)}`)).join(''):empty('calendar','No hay vencimientos','Agrega las fechas que no quieres pasar por alto.')}</div><p class="hint">Las fechas aparecen dentro de SIMÓ. No se envían notificaciones push con la app cerrada.</p>`;}
function warrantiesPage(){return `${formCard('add-warranty','Guardar garantía',field('Producto',input('name','text','Ej. Audífonos','required maxlength="85"'))+field('Tienda o proveedor',input('store','text','Opcional','maxlength="80"'))+field('Fecha de vencimiento',input('expires','date','','required'))+field('Referencia o recibo',input('ref','text','Ej. Factura 123','maxlength="100"')),'Guardar garantía')}${section('Productos protegidos')}<div class="card flat">${db.warranties.length?db.warranties.map(s=>rowItem('award',s.name,`${s.store||'Sin tienda'} · Hasta ${localDate(s.expires)}${s.ref?' · '+s.ref:''}`,`${days(s.expires)<0?'<span class="tag bad">Vencida</span>':days(s.expires)<31?'<span class="tag warm">Por vencer</span>':''}${delBtn('warranties',s.id)}`)).join(''):empty('award','Tu historial comienza aquí','Guarda la fecha de garantía y las referencias de tus compras.')}</div>`;}
function walletPage(){return `<div class="note">Guarda códigos de membresías y tarjetas de fidelidad. No introduzcas números bancarios, CVV, claves ni documentos sensibles.</div><div style="height:13px"></div>${formCard('add-wallet','Nueva tarjeta',field('Nombre de la tarjeta',input('name','text','Ej. Supermercado','required maxlength="70"'))+field('Código o número de socio',input('code','text','Código de fidelidad','required maxlength="120"')),'Guardar tarjeta')}${section('Tus tarjetas')}<div class="card flat">${db.wallet.length?db.wallet.map(s=>rowItem('wallet',s.name,s.code,`<button class="btn small ghost" data-action="showcard" data-id="${s.id}">Ver QR</button>${copyBtn(s.code)}${delBtn('wallet',s.id)}`)).join(''):empty('wallet','Sin tarjetas guardadas','Añade tus códigos de socio para encontrarlos rápido.')}</div>`;}
function qrPage(){return `<div class="card"><div class="card-title">Genera tu QR sin conectarte a internet</div><div class="chipset" style="margin-bottom:17px"><button data-action="qrtype" data-value="url" class="chip ${quickType==='url'?'active':''}">Enlace</button><button data-action="qrtype" data-value="text" class="chip ${quickType==='text'?'active':''}">Texto</button><button data-action="qrtype" data-value="wifi" class="chip ${quickType==='wifi'?'active':''}">Wi-Fi</button></div><form id="qrForm" class="formgrid">${quickType==='wifi'?field('Nombre Wi-Fi',input('ssid','text','Nombre de red','required maxlength="80"'))+field('Contraseña',input('wifiPass','text','Contraseña Wi-Fi','maxlength="80"'))+field('Seguridad',`<select name="security"><option value="WPA">WPA/WPA2/WPA3</option><option value="nopass">Sin contraseña</option></select>`):field(quickType==='url'?'Dirección web':'Texto',`<textarea name="qrText" required maxlength="600" placeholder="${quickType==='url'?'https://ejemplo.com':'Escribe un mensaje para compartir'}"></textarea>`,'full')}<div class="full"><button class="btn" type="submit">${icon('qr','icon-sm')} Crear QR</button></div></form>${generatedQR?`<div class="sep"></div><div class="qrcanvas" id="qrResult">${generatedQR}</div><div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn ghost" data-action="downloadqr">${icon('download','icon-sm')} Descargar PNG</button></div>`:''}</div><p class="hint">El código se genera localmente. La clave Wi-Fi no se guarda automáticamente.</p>`;}
function splitPage(){return `<div class="card"><div class="card-title">Divide un gasto con claridad</div><form id="splitForm" class="formgrid">${field('Total de la cuenta',input('amount','number','0.00','min="0.01" step="0.01" required'))+field('Propina (%)',input('tip','number','0','value="0" min="0" max="100" step="1"'))+field('Nombres, separados por coma',input('people','text','Ana, Luis, Yo','required maxlength="200"'),'full')+field('¿Quién pagó todo?',`<select name="payer"><option value="first">Primera persona</option><option value="equal">Cada uno paga su parte</option></select>`,'full')}<div class="full"><button class="btn" type="submit">${icon('users','icon-sm')} Calcular reparto</button></div></form>${splitCalc?`<div class="sep"></div><div class="eyebrow">Resultado</div><div class="metric" style="margin:8px 0">${masked(money(splitCalc.total))}</div><div class="card" style="background:var(--card2);padding:13px">${splitCalc.people.map(n=>rowItem('user',n,'Por persona',`<b>${masked(money(splitCalc.per))}</b>`)).join('')}</div><p class="hint">${safe(splitCalc.detail)}</p><button class="btn ghost" data-action="savesplit">Guardar cálculo</button>`:''}</div>${section('Últimos repartos')}<div class="card flat">${db.splitHistory.length?db.splitHistory.slice(0,6).map(s=>rowItem('users',s.people.join(', '),`${localDate(s.date)} · ${money(s.total)} total`,delBtn('splitHistory',s.id))).join(''):empty('users','Sin cuentas repartidas','Calcula cuánto debe aportar cada persona.')}</div>`;}
function photosPage(){return `<div class="card"><div class="card-title">Fotos más ligeras, sin subirlas a ninguna web</div><p class="muted sm">Reduce el peso de fotos antes de enviarlas. Se procesan directamente en el celular.</p><form id="imageForm" class="formgrid">${field('Seleccionar foto',`<input name="photo" type="file" accept="image/*" required>`,'full')+field('Tamaño máximo',`<select name="width"><option value="1280">1280 píxeles</option><option value="1920" selected>1920 píxeles</option><option value="800">800 píxeles</option><option value="2560">2560 píxeles</option></select>`)+field('Formato',`<select name="format"><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select>`)+field('Calidad (${Math.round(photoQuality*100)}%)',`<input type="range" name="quality" min="35" max="95" step="5" value="${Math.round(photoQuality*100)}">`,'full')}<div class="full"><button class="btn" type="submit">${icon('image','icon-sm')} Comprimir imagen</button></div></form>${lastPhoto?`<div class="sep"></div><img class="preview-img" src="${lastPhoto}" alt="Vista previa comprimida"><p class="sm muted">${(photoOriginal/1024).toFixed(0)} KB → ${(photoNew/1024).toFixed(0)} KB · ${photoNew<photoOriginal?Math.round((1-photoNew/photoOriginal)*100)+'% menos':'El resultado pesa más que el original'}</p><button class="btn ghost" data-action="downloadphoto">${icon('download','icon-sm')} Descargar foto</button>`:''}</div><p class="hint">No se guardan tus imágenes en los datos de SIMÓ. Los formatos HEIC/RAW podrían no ser compatibles con tu navegador.</p>`;}
function linksPage(){return `${formCard('add-link','Guardar enlace',field('Nombre',input('name','text','Ej. Mi banco, aula virtual','required maxlength="65"'))+field('Enlace web',input('url','url','https://...','required maxlength="500"'),'full')+field('Categoría',`<select name="category"><option>Frecuente</option><option>Estudio</option><option>Trabajo</option><option>Servicios</option><option>Otro</option></select>`),'Guardar enlace')}${section('Tus accesos directos')}<div class="card flat">${db.links.length?db.links.map(s=>rowItem('link',s.name,s.category+' · '+s.url,`<button class="btn small ghost" data-action="openlink" data-id="${s.id}">Abrir ${icon('external','icon-sm')}</button>${copyBtn(s.url)}${delBtn('links',s.id)}`)).join(''):empty('link','Nada guardado aún','Reúne las páginas que visitas con frecuencia.')}</div>`;}
const PACK_DEFAULT=['Documento de identidad','Cargador','Teléfono','Ropa','Artículos de higiene','Medicamentos necesarios'];
function tripsPage(){return `${formCard('add-trip','Nuevo viaje',field('Nombre del viaje',input('name','text','Ej. Fin de semana','required maxlength="65"'))+field('Fecha de salida',input('date','date','','required')),'Crear lista')}${section('Mis viajes')}<div style="display:grid;gap:12px">${db.trips.length?db.trips.map(tr=>`<div class="card"><div class="btnrowbetween"><div><b>${safe(tr.name)}</b><div class="hint">${localDate(tr.date)} · ${tr.items.filter(i=>i.done).length}/${tr.items.length} preparado</div></div>${delBtn('trips',tr.id)}</div><div class="progress" style="margin:12px 0"><div style="width:${tr.items.length?Math.round(tr.items.filter(i=>i.done).length/tr.items.length*100):0}%"></div></div>${tr.items.map(i=>`<label class="checkline" style="padding:7px 0"><input type="checkbox" data-action="tripcheck" data-trip="${tr.id}" data-item="${i.id}" ${i.done?'checked':''}><span style="${i.done?'text-decoration:line-through;opacity:.5':''};color:var(--ink)">${safe(i.name)}</span></label>`).join('')}<form class="tripItemForm" data-trip="${tr.id}" style="display:flex;gap:8px;margin-top:10px"><input name="item" required maxlength="70" placeholder="Añadir a la lista"><button class="btn small" type="submit">${icon('plus','icon-sm')}</button></form></div>`).join(''):empty('plane','Tu próxima aventura empieza aquí','Crea una lista y olvídate de olvidar cosas.')}</div>`;}
function snippetsPage(){return `<div class="note">Textos que repites muchas veces: una dirección de entrega, una respuesta profesional, instrucciones frecuentes o cualquier mensaje útil. No guardes contraseñas.</div><div style="height:13px"></div>${formCard('add-snippet','Nuevo texto rápido',field('Etiqueta',input('title','text','Ej. Mi dirección de entrega','required maxlength="70"'))+field('Texto',`<textarea name="body" placeholder="Escribe aquí el texto..." required maxlength="3500"></textarea>`,'full'),'Guardar texto')}${section('Mi biblioteca')}<div class="card flat">${db.snippets.length?db.snippets.map(s=>rowItem('text',s.title,s.body,`${copyBtn(s.body)}${delBtn('snippets',s.id)}`)).join(''):empty('text','Sin textos rápidos','Guarda mensajes que puedas copiar en un toque.')}</div>`;}

function showModal(title,body){const el=$('#dialog');el.className='overlay';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="modalhead"><h2>${safe(title)}</h2><button class="ghost-icon" data-action="closemodal" aria-label="Cerrar">${icon('close')}</button></div>${body}</div>`;}
function closeModal(){const el=$('#dialog');el.className='hide';el.innerHTML='';}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado al portapapeles');}catch{showModal('Copiar texto',`<textarea readonly style="width:100%;min-height:120px">${safe(text)}</textarea><p class="hint">Mantén pulsado para seleccionar y copiar.</p>`);}}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function makeQR(content){const encoder=new TextEncoder().encode(content),binary=Array.from(encoder,byte=>String.fromCharCode(byte)).join('');const q=new QRCode(-1,QRErrorCorrectLevel.M);q.addData(binary);q.make();const n=q.getModuleCount(),margin=4;let path='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))path+=`M${x+margin} ${y+margin}h1v1h-1z`;return `<svg viewBox="0 0 ${n+margin*2} ${n+margin*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#151929"/></svg>`}
async function doQrDownload(){const svg=$('#qrResult svg');if(!svg)return;try{const markup=new XMLSerializer().serializeToString(svg),blob=new Blob([markup],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=document.createElement('canvas'),scale=8;c.width=img.width*scale||1024;c.height=img.height*scale||1024;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?download(b,'SIMO-QR.png'):toast('No se pudo exportar el código.'),'image/png');}catch(e){toast('No se pudo generar la imagen QR.')}}
function cleanUrl(url){try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:null;}catch{return null;}}
async function doPhoto(form){const fd=new FormData(form),file=fd.get('photo');if(!file||!file.size)throw Error('Selecciona una imagen.');if(file.size>35*1024*1024)throw Error('La imagen es demasiado grande para procesarla aquí (máximo 35 MB).');if(!file.type.startsWith('image/'))throw Error('Selecciona un archivo de imagen.');const max=Number(fd.get('width')),quality=Number(fd.get('quality'))/100,format=fd.get('format');photoQuality=quality;const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(Error('No se pudo abrir la foto.'));img.src=url});const ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('No se pudo crear el editor de imagen.');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);lastPhoto=canvas.toDataURL(format,quality);photoOriginal=file.size;photoNew=Math.round((lastPhoto.length-lastPhoto.indexOf(',')-1)*.75);photoFilename=file.name.replace(/\.[^/.]+$/,'')+(format==='image/webp'?'-simo.webp':'-simo.jpg');}finally{URL.revokeObjectURL(url)}renderContent();toast('Imagen procesada en tu dispositivo.');}
function dataurlToBlob(url){const [meta,val]=url.split(','),mime=meta.match(/data:([^;]+)/)?.[1]||'image/png',binary=atob(val),arr=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)arr[i]=binary.charCodeAt(i);return new Blob([arr],{type:mime});}

async function handleForm(e){const form=e.target;if(!form.matches('form'))return;e.preventDefault();if(form.id==='authForm'){await doAuth(form);return;}if(form.id==='editProfileForm'){const next=str(new FormData(form).get('name'));if(next.length<2){toast('Escribe un nombre válido.');return;}active.name=next;persistProfiles();closeModal();render();toast('Nombre actualizado.');return;}if(form.id==='changePassForm'){try{const v=new FormData(form),old=String(v.get('old')),next=String(v.get('next'));if(next.length<8||next!==v.get('confirm'))throw Error('Comprueba la nueva contraseña.');const oldKey=await derive(old,active.salt);await decrypt(active.proof,oldKey);const salt=b64(crypto.getRandomValues(new Uint8Array(16))),key=await derive(next,salt);active.salt=salt;active.proof=await encrypt({ok:true},key);cryptKey=key;persistProfiles();await save();const remember=remembered();const token=JSON.stringify({id:active.id,key:b64(await crypto.subtle.exportKey('raw',key))});(remember?localStorage:sessionStorage).setItem(K+'session',token);closeModal();toast('Contraseña actualizada.');}catch(err){toast('No se pudo cambiar: '+(err.message||'contraseña incorrecta'));}return;}try{let values=new FormData(form),get=n=>str(values.get(n));const requireNum=(k)=>{const n=Number(get(k));if(!Number.isFinite(n)||n<=0)throw Error('Introduce valores positivos válidos.');return n};const append=(type,record)=>{db[type].unshift({id:id(),...record});};switch(form.id){

case 'reset':if(!confirm('¿Borrar TODOS los datos de las herramientas de esta cuenta? Esta acción no se puede deshacer.'))return;{const old={...db.settings};db=blankDB();db.settings=old;await save();renderContent();toast('Datos eliminados.');}return;
}}catch(err){console.error(err);toast(err.message||'Ocurrió un error.')}}
async function handleChange(e){const t=e.target;try{if(t.matches('[data-setting]')){db.settings[t.dataset.setting]=t.value;await save();render();return;}if(t.matches('[data-action=tripcheck]')){const tr=db.trips.find(s=>s.id===t.dataset.trip),it=tr?.items.find(s=>s.id===t.dataset.item);if(it)it.done=t.checked;await save();renderContent();return;}if(t.id==='importFile'&&t.files?.[0]){const raw=await t.files[0].text(),file=JSON.parse(raw);if(file.format!=='simo-tools-v2'||!file.data||!Array.isArray(file.data.subscriptions))throw Error('Archivo de respaldo no reconocido.');if(!confirm('¿Reemplazar los datos actuales con este respaldo?'))return;db={...blankDB(),...file.data,settings:{...blankDB().settings,...file.data.settings}};for(const key of ['subscriptions','deadlines','warranties','wallet','links','trips','snippets','splitHistory'])if(!Array.isArray(db[key]))db[key]=[];await save();render();toast('Datos restaurados.');}}catch(err){toast(err.message||'No se pudo procesar el archivo.');console.error(err)}}
function handleInput(e){if(e.target.id==='globalSearch'){query=e.target.value;const q=query.toLowerCase(),found=TOOLS.filter(t=>t.slice(1,3).join(' ').toLowerCase().includes(q));if(query){page='tools';tab='tools';$('#content').innerHTML=`<div class="eyebrow">RESULTADOS DE BÚSQUEDA</div><h1 style="margin-top:10px">${found.length} herramienta${found.length===1?'':'s'}</h1><div class="grid-tools" style="margin-top:22px">${found.map(toolCard).join('')||empty('search','Sin resultados','Prueba con otro nombre.')}</div>`;$('#globalSearch').focus();}else{page='home';tab='home';renderContent();}return;}}
window.addEventListener('DOMContentLoaded',async()=>{if(!globalThis.crypto?.subtle){errorText='Abre esta aplicación en Chrome o como APK para utilizar el inicio de sesión seguro.';}await restore();render();document.addEventListener('submit',handleForm);document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);$('#dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeModal()});matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')applyTheme()});});
